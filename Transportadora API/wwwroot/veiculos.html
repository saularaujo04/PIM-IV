<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Veículos - Transportadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="clientes.html">Logística PIM IV</a>
            <div class="navbar-nav">
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link" href="motoristas.html">Motoristas</a>
                <a class="nav-link active" href="veiculos.html">Veículos</a>
                <a class="nav-link" href="entregas.html">Entregas</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white font-weight-bold">Novo Veículo</div>
                    <div class="card-body">
                        <form id="formVeiculo">
                            <div class="mb-3">
                                <label class="form-label">Placa</label>
                                <input type="text" id="placa" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Modelo</label>
                                <input type="text" id="modelo" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Capacidade (Kg)</label>
                                <input type="number" step="0.01" id="capacidadeKg" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tipo</label>
                                <input type="text" id="tipo" class="form-control" placeholder="Ex: Camião, Vam" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Cadastrar Veículo</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">Veículos Cadastrados</div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Placa</th>
                                    <th>Modelo</th>
                                    <th>Capacidade (Kg)</th>
                                    <th>Tipo</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaVeiculos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
            // @ts-nocheck
            (function () {
                const API_URL = 'https://localhost:7026/api/Clientes';

                async function carregarVeiculos() {
                    try {
                        const res = await fetch(API_URL);
                        const veiculos = await res.json();
                        const tbody = document.getElementById('tabelaVeiculos');
                        if (!tbody) return;

                        tbody.innerHTML = '';
                        veiculos.forEach((v) => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${v.id}</td>
                                    <td>${v.placa}</td>
                                    <td>${v.modelo}</td>
                                    <td>${v.capacidadeKg} kg</td>
                                    <td>${v.tipo || '-'}</td>
                                </tr>`;
                        });
                    } catch (err) {
                        console.error('Erro ao carregar veículos:', err);
                    }
                }

                const form = document.getElementById('formVeiculo');
                if (form) {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const veiculo = {
                            placa: document.getElementById('placa').value,
                            modelo: document.getElementById('modelo').value,
                            capacidadeKg: parseFloat(document.getElementById('capacidadeKg').value),
                            tipo: document.getElementById('tipo').value
                        };

                        const res = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(veiculo)
                        });

                        if (res.ok) {
                            alert('Veículo cadastrado com sucesso!');
                            form.reset();
                            carregarVeiculos();
                        } else {
                            alert('Erro ao cadastrar veículo.');
                        }
                    });
                }

                carregarVeiculos();
            })();
    </script>
</body>
</html>

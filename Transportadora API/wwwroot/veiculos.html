<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Veículos - Transportadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Logística PIM IV</a>
            <div class="navbar-nav">
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link" href="motoristas.html">Motoristas</a>
                <a class="nav-link active" href="veiculos.html">Veículos</a>
                <a class="nav-link" href="entregas.html">Entregas</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white font-weight-bold">Novo Veículo</div>
                    <div class="card-body">
                        <!-- Formulário com validação nativa -->
                        <form id="formVeiculo" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label class="form-label">Placa</label>
                                <input type="text" id="placa" class="form-control" required minlength="8">
                                <div class="invalid-feedback">Informe uma placa válida (ex: ABC-1234 ou ABC1D23).</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Modelo</label>
                                <input type="text" id="modelo" class="form-control" required>
                                <div class="invalid-feedback">O modelo é obrigatório.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Capacidade (Kg)</label>
                                <input type="text" id="capacidadeKg" class="form-control" required>
                                <div class="invalid-feedback">A capacidade é obrigatória.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tipo</label>
                                <input type="text" id="tipo" class="form-control" placeholder="Ex: Caminhão, Van" required>
                                <div class="invalid-feedback">O tipo de veículo é obrigatório.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Cadastrar Veículo</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">Veículos Cadastrados</div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Placa</th>
                                    <th>Modelo</th>
                                    <th>Capacidade (Kg)</th>
                                    <th>Tipo</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaVeiculos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTAINER DO TOAST -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toastNotificacao" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold" id="toastMensagem"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/imask"></script>

    <script>
                // @ts-nocheck

                function mostrarToast(mensagem, corFundo) {
                    const toastEl = document.getElementById('toastNotificacao');
                    const toastMsg = document.getElementById('toastMensagem');
                    toastEl.className = `toast align-items-center text-white border-0 ${corFundo}`;
                    toastMsg.textContent = mensagem;
                    const toast = new bootstrap.Toast(toastEl);
                    toast.show();
                }

                (function () {
                    const API_URL = 'https://localhost:7026/api/Veiculos';

                    async function carregarVeiculos() {
                        try {
                            const res = await fetch(API_URL);
                            const veiculos = await res.json();
                            const tbody = document.getElementById('tabelaVeiculos');
                            if (!tbody) return;

                            tbody.innerHTML = '';
                            veiculos.forEach((v) => {
                                tbody.innerHTML += `
                                    <tr>
                                        <td>${v.id}</td>
                                        <td>${v.placa}</td>
                                        <td>${v.modelo}</td>
                                        <td>${v.capacidadeKg} kg</td>
                                        <td>${v.tipo || '-'}</td>
                                    </tr>`;
                            });
                        } catch (err) {
                            mostrarToast('Erro ao carregar a lista de veículos.', 'bg-danger');
                        }
                    }

                    const form = document.getElementById('formVeiculo');
                    if (form) {
                        form.addEventListener('submit', async (e) => {
                            e.preventDefault();

                            // Validação do Bootstrap
                            if (!form.checkValidity()) {
                                e.stopPropagation();
                                form.classList.add('was-validated');
                                return;
                            }

                            let rawCapacidade = document.getElementById('capacidadeKg').value;
                            rawCapacidade = rawCapacidade.replace(/\./g, '').replace(',', '.');

                            const veiculo = {
                                placa: document.getElementById('placa').value,
                                modelo: document.getElementById('modelo').value,
                                capacidadeKg: parseFloat(rawCapacidade) || 0,
                                tipo: document.getElementById('tipo').value
                            };

                            try {
                                const res = await fetch(API_URL, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(veiculo)
                                });

                                if (res.ok) {
                                    mostrarToast('Veículo cadastrado com sucesso!', 'bg-success');
                                    form.reset();
                                    form.classList.remove('was-validated');
                                    carregarVeiculos();
                                } else {
                                    mostrarToast('Erro ao cadastrar veículo.', 'bg-danger');
                                }
                            } catch (err) {
                                mostrarToast('Falha na comunicação com o servidor.', 'bg-danger');
                            }
                        });
                    }

                    // MÁSCARAS IMASK
                    const placaInput = document.getElementById('placa');
                    if (placaInput) {
                        IMask(placaInput, {
                            mask: 'aaa-0000',
                            prepare: function (str) {
                                return str.toUpperCase();
                            }
                        });
                    }

                    const capacidadeInput = document.getElementById('capacidadeKg');
                    if (capacidadeInput) {
                        IMask(capacidadeInput, {
                            mask: Number,
                            min: 0,
                            thousandsSeparator: '.',
                            radix: ','
                        });
                    }

                    carregarVeiculos();
                })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Clientes - Transportadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Logística PIM IV</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="clientes.html">Clientes</a>
                <a class="nav-link" href="motoristas.html">Motoristas</a>
                <a class="nav-link" href="veiculos.html">Veículos</a>
                <a class="nav-link" href="entregas.html">Entregas</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white font-weight-bold">Novo Cliente</div>
                    <div class="card-body">
                        <form id="formCliente">
                            <div class="mb-3">
                                <label class="form-label">Nome / Razão Social</label>
                                <input type="text" id="nome" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CPF / CNPJ</label>
                                <input type="text" id="documento" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">E-mail</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Telefone</label>
                                <input type="text" id="telefone" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Cadastrar Cliente</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">Clientes Cadastrados</div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Documento</th>
                                    <th>E-mail</th>
                                    <th>Telefone</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaClientes">
                                <!-- Dados carregados via Fetch API -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
            // @ts-nocheck
            (function () {
                const API_URL = 'https://localhost:7026/api/Clientes';

                async function carregarClientes() {
                    try {
                        const res = await fetch(API_URL);
                        const clientes = await res.json();
                        const tbody = document.getElementById('tabelaClientes');
                        if (!tbody) return;

                        tbody.innerHTML = '';
                        clientes.forEach((c) => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${c.id}</td>
                                    <td>${c.nome}</td>
                                    <td>${c.documento}</td>
                                    <td>${c.email}</td>
                                    <td>${c.telefone}</td>
                                </tr>`;
                        });
                    } catch (err) {
                        console.error('Erro ao carregar clientes:', err);
                    }
                }

                const form = document.getElementById('formCliente');
                if (form) {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const cliente = {
                            nome: document.getElementById('nome').value,
                            documento: document.getElementById('documento').value,
                            email: document.getElementById('email').value,
                            telefone: document.getElementById('telefone').value
                        };

                        const res = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(cliente)
                        });

                        if (res.ok) {
                            alert('Cliente cadastrado com sucesso!');
                            form.reset();
                            carregarClientes();
                        } else {
                            alert('Erro ao cadastrar cliente.');
                        }
                    });
                }

                carregarClientes();
            })();
    </script>

</body>
</html>

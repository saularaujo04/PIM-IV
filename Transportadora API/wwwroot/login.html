<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Transportadora PIM IV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary bg-opacity-25 d-flex align-items-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0 rounded-3">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold">Logística PIM IV</h3>
                            <p class="text-muted small">Acesse o painel de controle</p>
                        </div>
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">E-mail corporativo</label>
                                <input type="email" id="email" class="form-control form-control-lg" placeholder="admin@pim.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Senha</label>
                                <input type="password" id="senha" class="form-control form-control-lg" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Acessar Sistema</button>
                        </form>

                        <div class="mt-4 pt-3 border-top text-center text-muted small">
                            <p class="mb-1 fw-bold">Contas de teste (simulação):</p>
                            <span>admin@pim.com (Total)</span><br>
                            <span>log@pim.com (Operador)</span><br>
                            <span>mot@pim.com (Motorista)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
            // @ts-nocheck
            document.getElementById('formLogin').addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const senha = document.getElementById('senha').value;

                try {
                    const res = await fetch('https://localhost:7026/api/Auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, senha })
                    });

                    if (res.ok) {
                        const usuario = await res.json();

                        // Salva a sessão autenticada diretamente pelo banco
                        localStorage.setItem('perfilAcesso', usuario.perfil);
                        localStorage.setItem('usuarioNome', usuario.nome);

                        window.location.href = 'index.html';
                    } else {
                        alert('E-mail ou senha inválidos no SQL Server!');
                    }
                } catch (err) {
                    console.error('Erro de conexão:', err);
                    alert('Não foi possível conectar à API de Autenticação.');
                }
            });
    </script>
</body>
</html>

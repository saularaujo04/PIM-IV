<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Transportadora PIM IV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary bg-opacity-25 d-flex align-items-center" style="height: 100vh;">

    <div class="container">
        <!-- O Card de Login continua igual... -->
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0 rounded-3">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold">Logística PIM IV</h3>
                            <p class="text-muted small">Acesse o painel de controle</p>
                        </div>
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">E-mail corporativo</label>
                                <input type="email" id="email" class="form-control form-control-lg" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Senha</label>
                                <input type="password" id="senha" class="form-control form-control-lg" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Acessar Sistema</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 1. CONTAINER DO TOAST (Aviso flutuante no canto superior direito) -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toastNotificacao" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold" id="toastMensagem">
                    <!-- A mensagem vai aparecer aqui -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- 2. Importação do JavaScript do Bootstrap (Necessário para os Toasts funcionarem) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
            // @ts-nocheck

            // 3. Função reutilizável para chamar o Toast
            function mostrarToast(mensagem, corFundo) {
                const toastEl = document.getElementById('toastNotificacao');
                const toastMsg = document.getElementById('toastMensagem');

                // Remove cores antigas e adiciona a nova (ex: bg-danger, bg-success)
                toastEl.className = `toast align-items-center text-white border-0 ${corFundo}`;
                toastMsg.textContent = mensagem;

                // Dispara o Toast na tela
                const toast = new bootstrap.Toast(toastEl);
                toast.show();
            }

            document.getElementById('formLogin').addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const senha = document.getElementById('senha').value;

                try {
                    const res = await fetch('https://localhost:7026/api/Auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, senha })
                    });

                    if (res.ok) {
                        const usuario = await res.json();
                        localStorage.setItem('perfilAcesso', usuario.perfil);
                        localStorage.setItem('usuarioNome', usuario.nome);
                        window.location.href = 'index.html';
                    } else {
                        // 4. Substituímos o alert() pelo Toast vermelho (bg-danger)
                        mostrarToast('E-mail ou senha inválidos!', 'bg-danger');
                    }
                } catch (err) {
                    console.error('Erro de conexão:', err);
                    mostrarToast('Não foi possível conectar ao servidor.', 'bg-dark');
                }
            });
    </script>
</body>
</html>

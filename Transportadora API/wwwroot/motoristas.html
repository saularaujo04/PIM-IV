<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Motoristas - Transportadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="clientes.html">Logística PIM IV</a>
            <div class="navbar-nav">
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link active" href="motoristas.html">Motoristas</a>
                <a class="nav-link" href="veiculos.html">Veículos</a>
                <a class="nav-link" href="entregas.html">Entregas</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white font-weight-bold">Novo Motorista</div>
                    <div class="card-body">
                        <form id="formMotorista">
                            <div class="mb-3">
                                <label class="form-label">Nome Completo</label>
                                <input type="text" id="nome" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CPF</label>
                                <input type="text" id="cpf" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CNH</label>
                                <input type="text" id="cnh" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Telefone</label>
                                <input type="text" id="telefone" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Cadastrar Motorista</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">Motoristas Cadastrados</div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>CPF</th>
                                    <th>CNH</th>
                                    <th>Telefone</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaMotoristas"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
            // @ts-nocheck
            (function () {
                const API_URL = 'https://localhost:7026/api/Clientes';

                async function carregarMotoristas() {
                    try {
                        const res = await fetch(API_URL);
                        const motoristas = await res.json();
                        const tbody = document.getElementById('tabelaMotoristas');
                        if (!tbody) return;

                        tbody.innerHTML = '';
                        motoristas.forEach((m) => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${m.id}</td>
                                    <td>${m.nome}</td>
                                    <td>${m.cpf || m.documento || '-'}</td>
                                    <td>${m.cnh}</td>
                                    <td>${m.telefone || '-'}</td>
                                </tr>`;
                        });
                    } catch (err) {
                        console.error('Erro ao carregar motoristas:', err);
                    }
                }

                const form = document.getElementById('formMotorista');
                if (form) {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const motorista = {
                            nome: document.getElementById('nome').value,
                            cpf: document.getElementById('cpf').value,
                            cnh: document.getElementById('cnh').value,
                            telefone: document.getElementById('telefone').value
                        };

                        const res = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(motorista)
                        });

                        if (res.ok) {
                            alert('Motorista cadastrado com sucesso!');
                            form.reset();
                            carregarMotoristas();
                        } else {
                            alert('Erro ao cadastrar motorista.');
                        }
                    });
                }

                carregarMotoristas();
            })();
    </script>
</body>
</html>

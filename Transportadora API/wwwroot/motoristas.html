<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Motoristas - Transportadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Logística PIM IV</a>
            <div class="navbar-nav">
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link active" href="motoristas.html">Motoristas</a>
                <a class="nav-link" href="veiculos.html">Veículos</a>
                <a class="nav-link" href="entregas.html">Entregas</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white font-weight-bold">Novo Motorista</div>
                    <div class="card-body">
                        <!-- Formulário com validação nativa -->
                        <form id="formMotorista" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label class="form-label">Nome Completo</label>
                                <input type="text" id="nome" class="form-control" required>
                                <div class="invalid-feedback">O nome é obrigatório.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CPF</label>
                                <input type="text" id="cpf" class="form-control" required minlength="14">
                                <div class="invalid-feedback">Informe um CPF válido (11 dígitos).</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CNH</label>
                                <input type="text" id="cnh" class="form-control" required minlength="11">
                                <div class="invalid-feedback">A CNH deve ter 11 dígitos.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Telefone</label>
                                <input type="text" id="telefone" class="form-control" required minlength="14">
                                <div class="invalid-feedback">O telefone é obrigatório.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Cadastrar Motorista</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">Motoristas Cadastrados</div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>CPF</th>
                                    <th>CNH</th>
                                    <th>Telefone</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaMotoristas"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTAINER DO TOAST -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toastNotificacao" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold" id="toastMensagem"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/imask"></script>

    <script>
                // @ts-nocheck

                function mostrarToast(mensagem, corFundo) {
                    const toastEl = document.getElementById('toastNotificacao');
                    const toastMsg = document.getElementById('toastMensagem');
                    toastEl.className = `toast align-items-center text-white border-0 ${corFundo}`;
                    toastMsg.textContent = mensagem;
                    const toast = new bootstrap.Toast(toastEl);
                    toast.show();
                }

                (function () {
                    const API_URL = 'https://localhost:7026/api/Motoristas';

                    async function carregarMotoristas() {
                        try {
                            const res = await fetch(API_URL);
                            const motoristas = await res.json();
                            const tbody = document.getElementById('tabelaMotoristas');
                            if (!tbody) return;

                            tbody.innerHTML = '';
                            motoristas.forEach((m) => {
                                tbody.innerHTML += `
                                    <tr>
                                        <td>${m.id}</td>
                                        <td>${m.nome}</td>
                                        <td>${m.cpf || m.documento || '-'}</td>
                                        <td>${m.cnh}</td>
                                        <td>${m.telefone || '-'}</td>
                                    </tr>`;
                            });
                        } catch (err) {
                            mostrarToast('Erro ao carregar a lista de motoristas.', 'bg-danger');
                        }
                    }

                    const form = document.getElementById('formMotorista');
                    if (form) {
                        form.addEventListener('submit', async (e) => {
                            e.preventDefault();

                            // Validação do Bootstrap
                            if (!form.checkValidity()) {
                                e.stopPropagation();
                                form.classList.add('was-validated');
                                return;
                            }

                            const motorista = {
                                nome: document.getElementById('nome').value,
                                cpf: document.getElementById('cpf').value,
                                cnh: document.getElementById('cnh').value,
                                telefone: document.getElementById('telefone').value
                            };

                            try {
                                const res = await fetch(API_URL, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(motorista)
                                });

                                if (res.ok) {
                                    mostrarToast('Motorista cadastrado com sucesso!', 'bg-success');
                                    form.reset();
                                    form.classList.remove('was-validated');
                                    carregarMotoristas();
                                } else {
                                    mostrarToast('Erro ao cadastrar motorista.', 'bg-danger');
                                }
                            } catch (err) {
                                mostrarToast('Falha na comunicação com o servidor.', 'bg-danger');
                            }
                        });
                    }

                    // MÁSCARAS IMASK
                    const cpfInput = document.getElementById('cpf');
                    if (cpfInput) IMask(cpfInput, { mask: '000.000.000-00' });

                    const cnhInput = document.getElementById('cnh');
                    if (cnhInput) IMask(cnhInput, { mask: '00000000000' });

                    const telInput = document.getElementById('telefone');
                    if (telInput) IMask(telInput, { mask: '(00) 00000-0000' });

                    carregarMotoristas();
                })();
    </script>
</body>
</html>

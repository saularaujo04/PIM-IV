name: CI/CD - Build e Validacao Docker (.NET 8)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar solucao (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Validar construcao da imagem Docker
        run: docker build -t transportadora-api:latest .
